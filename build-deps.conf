# build-deps.conf — single-pin per external build tool
# Format: <name> <strategy> <pin> <source>
#   name      = Homebrew formula name (exact), except `asdf` (toolchain bootstrapper itself)
#   strategy  = external | brew | bootstrap
#               (bootstrap = provisioned by toolchain.sh itself, ignored by sync.sh —
#                must NOT be `external`: sync.sh would treat it as a skippable formula
#                and homebrew/core really has an `asdf` formula)
#   pin       = version to provide / expect
#   source    = how to provision (rustup, go tarball URL, asdf release tarball URL, asdf:python)
#
# Phase 1: rust + go via official binaries (fast), python via asdf (local-machine rule).
# Python: single asdf pin can only satisfy ONE slot exactly.
#   Core has python@3.13 (3.13.15) and python@3.14 (3.14.7); host asdf is 3.13.7.
#   We externalize python@3.13 (patch-level skew 3.13.7 vs 3.13.15 = allow with warning);
#   python@3.14 stays brewed (minor skew 3.13 vs 3.14 = reject patching).
#   If you bump the single python pin to 3.14.x, flip this line (documented).
#
rust          external  1.82.0  rustup:https://sh.rustup.rs
go            external  1.27.1  https://go.dev/dl/go1.27.1.darwin-amd64.tar.gz
python@3.13   external  3.13.7  asdf:python
# asdf itself: bootstrapped from the precompiled release tarball (no brew needed).
# Intel VM => darwin-amd64 asset. Fail loud on 404/layout change (no fallback).
asdf          bootstrap 0.20.0  https://github.com/asdf-vm/asdf/releases/download/v0.20.0/asdf-v0.20.0-darwin-amd64.tar.gz
# python@3.14 is intentionally NOT listed here — remains `brew` (bottle once, reuse) in Phase 1
