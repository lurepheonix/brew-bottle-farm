# build-deps.conf — per-slot pins for external build tools (never bottled)
# Format: <name> <strategy> <pin> <source>
#   name      = Homebrew formula name (exact).
#               python has one row PER SLOT (python@3.13 / python@3.14 / python@3.15):
#               one pin satisfies exactly one slot (patch-level skew allowed, minor skew rejected).
#               `node` is the brew formula name; toolchain maps it to the asdf `nodejs` plugin.
#   strategy  = external | bootstrap
#               external  = filtered from the bottle queue by sync.sh, provided by toolchain.sh.
#                           `rust`/`go` are pure :build deps (patched out); `python@*`/`ruby`/`node`
#                           are filtered because leaves never runtime-link them (verified:
#                           runtime closure of the starter set contains no interpreter).
#                           Bottled intermediaries that DO runtime-link an interpreter
#                           (meson/sphinx-doc -> python, asciidoctor -> ruby) stay UNPATCHED and
#                           use core interpreters inside the VM (brew installs them as deps);
#                           the linkage gate blocks EXTERNAL paths from leaking into bottles.
#               bootstrap = provisioned by toolchain.sh itself, ignored by sync.sh —
#                           must NOT be `external`: sync.sh would treat the real `asdf`/`uv`
#                           formulae as skippable (homebrew/core really has them).
#   pin       = version to provide / expect. Python/ruby/node track latest finals.
#   source    = how to provision:
#                 rustup:<url> = rustup installer
#                 https://...  = direct tarball (go, asdf, uv)
#                 uv:python    = `uv python install <pin>` first (fast prebuilt);
#                                falls back to `asdf install python <pin>` (compile)
#                                when uv lacks a build (e.g. 3.15.0 final on Intel).
#                 asdf:<plugin> = `asdf plugin add` + `asdf install` (node prebuilt, ruby compiled)
#
# Language runtimes are never bottled: they are provided via uv/asdf (see docs/stack.md).
# One-time compile cost (python slots, ruby) is covered by the `toolchain-ready` VM snapshot.
#
rust          external  1.82.0  rustup:https://sh.rustup.rs
go            external  1.27.1  https://go.dev/dl/go1.27.1.darwin-amd64.tar.gz
python@3.13   external  3.13.16 uv:python
python@3.14   external  3.14.8  uv:python
python@3.15   external  3.15.0  uv:python
ruby          external  4.0.7   asdf:ruby
node          external  26.12.0 asdf:nodejs
# Bootstrappers (precompiled darwin-amd64 release tarballs, no brew needed).
# Intel VM => darwin-amd64 assets. Fail loud on 404/layout change (no fallback).
asdf          bootstrap 0.20.0  https://github.com/asdf-vm/asdf/releases/download/v0.20.0/asdf-v0.20.0-darwin-amd64.tar.gz
uv            bootstrap 0.12.5  https://github.com/astral-sh/uv/releases/download/0.12.5/uv-x86_64-apple-darwin.tar.gz
